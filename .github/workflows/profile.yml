name: build profile assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

# only one run at a time, so two runs can never race to push
concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: build dashboard.svg
        env:
          GH_USER: Mannkr07
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/build_dashboard.py

      - name: commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dashboard.svg
          if git diff --staged --quiet; then
            echo "no change"; exit 0
          fi
          git commit -m "chore: refresh dashboard"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed"; exit 0
            fi
            echo "push race, retrying in 5s"; sleep 5
          done
          exit 1

  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: generate snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: Mannkr07
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=%23E3B341

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
